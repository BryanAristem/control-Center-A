<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/^#{1,3} (.*)$/gm,'<b>$1</b>');
const every=(f,ms)=>setInterval(()=>{if(!document.hidden)f()},ms);
const DEF={projects:[],chats:[],providers:[
 {id:'anthropic',name:'Claude',type:'anthropic',url:'https://api.anthropic.com/v1/messages',model:'claude-sonnet-5-5',key:''},
 {id:'openai',name:'OpenAI',type:'openai',url:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini',key:''},
 {id:'gemini',name:'Gemini (gratuit)',type:'openai',url:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',model:'gemini-2.5-flash',key:''},
 {id:'groq',name:'Groq (gratuit)',type:'openai',url:'https://api.groq.com/openai/v1/chat/completions',model:'llama-3.3-70b-versatile',key:''},
 {id:'openrouter',name:'OpenRouter (gratuit)',type:'openai',url:'https://openrouter.ai/api/v1/chat/completions',model:'meta-llama/llama-3.3-70b-instruct:free',key:''}],
 main:'anthropic',voice:true,name:'',watch:[],feed:[],notifs:[],loc:null};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('cos')||'{}'))}catch(e){S=DEF}
DEF.providers.forEach(d=>{if(!S.providers.some(p=>p.id===d.id))S.providers.push({...d})});
const save=()=>{try{localStorage.setItem('cos',JSON.stringify(S))}catch(e){if(!save.w){save.w=1;setTimeout(()=>alert('Stockage plein : exporte tes données dans Réglages.'),0)}}};
const D={};let camOn=false,tab='dash',openP=null,openC=null,busy=false,news=null,topic='',shot=null,camOut='',stream=null,advice='';
const TPL={'Site web':['Définir le but et le public','Choisir le nom de domaine','Faire la maquette','Créer le design','Développer les pages','Ajouter les contenus','Tester sur mobile','Mettre en ligne'],
'Site pour un ami':['Appel de cadrage avec l\'ami','Valider le budget et le délai','Récupérer logo et textes','Maquette à valider','Développement','Révisions avec l\'ami','Mise en ligne','Formation et remise des accès']};

/* ---------- IA ---------- */
const prov=id=>S.providers.find(p=>p.id===(id||S.main))||S.providers[0];
async function ask(pid,msgs,o={}){
 const p=prov(pid);if(!p.key)throw new Error('Ajoute ta clé API dans Réglages pour '+p.name);
 const sys=(o.system||"Tu es Aristem, un assistant personnel avec une personnalité claire et directe. Réponds en français, clair et concis.")+(S.name?" L'utilisateur s'appelle "+S.name+".":"");
 let r,d;
 if(p.type==='anthropic'){
  const m=msgs.map((x,i)=>({role:x.role,content:(o.img&&i===msgs.length-1)?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:o.img.split(',')[1]}},{type:'text',text:x.text}]:x.text}));
  const body={model:p.model,max_tokens:o.max||1200,system:sys,messages:m};
  if(o.search)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
  r=await fetch(p.url,{method:'POST',headers:{'content-type':'application/json','x-api-key':p.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);
  return d.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
 }
 const m=[{role:'system',content:sys},...msgs.map((x,i)=>({role:x.role,content:(o.img&&i===msgs.length-1)?[{type:'text',text:x.text},{type:'image_url',image_url:{url:o.img}}]:x.text}))];
 r=await fetch(p.url,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+p.key},body:JSON.stringify({model:p.model,messages:m})});
 d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);
 return d.choices[0].message.content;
}
function speak(t){if(!S.voice||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*#_`]/g,''));u.lang='fr-FR';speechSynthesis.speak(u)}
function listen(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Micro non supporté par ce navigateur');const r=new R();r.lang='fr-FR';r.onresult=e=>cb(e.results[0][0].transcript);r.start()}
const err=e=>alert('Erreur : '+e.message);
const pct=p=>p.steps.length?Math.round(p.steps.filter(s=>s.done).length/p.steps.length*100):0;

/* ---------- Vues ---------- */
function dash(){
 const all=S.projects.flatMap(p=>p.steps),tot=all.length,dn=all.filter(s=>s.done).length,pc=tot?Math.round(dn/tot*100):0;
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d});
 const cnt=days.map(d=>all.filter(s=>s.done&&s.at>=d.getTime()&&s.at<d.getTime()+864e5).length),mx=Math.max(1,...cnt);

 const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 const perm='Notification' in window?Notification.permission:'denied';
 const fd=days.map(d=>S.feed.filter(x=>x.at>=d.getTime()&&x.at<d.getTime()+864e5).length),me=G.me();
 const hv=[pc,bt?Math.round(bt.level*100):0,D.ping?Math.max(5,Math.min(100,Math.round(100-D.ping/6))):0];
 const PC=['#FF6A00','#FFB627','#ffe6cf','#E8470F','#FFD2A6','#8a6a4a'];let ac=0;
 const stops=tot?S.projects.map((p,i)=>{const a=ac;ac+=p.steps.length/tot*100;return `${PC[i%6]} ${a}% ${ac}%`}).join(','):'#1a0d06 0 100%';
 const rw=(a,b,id)=>`<div class="r"><span>${a}</span><b${id?` id="${id}"`:''}>${b}</b></div>`,iss=D.iss,eq=D.eq||[],big=eq.reduce((m,q)=>q.m>(m.m||0)?q:m,{});
 const WC=[['Local',undefined],['UTC','UTC'],['Paris','Europe/Paris'],['New York','America/New_York'],['Tokyo','Asia/Tokyo']];

 const cmi=(i,k)=>`<a class="cm" href="${esc(safe(i.u))}" target="_blank" rel="noopener"><span class="bub">${bub[k%5]}</span>${i.im?`<img src="${esc(i.im)}" alt="" loading="lazy" onerror="this.remove()">`:''}<div><b>${esc(i.t)}</b><small>${esc(i.src)} · il y a ${ago(i.at)}</small></div></a>`;
 let notes='';
 if(g){const wx=pl.wx,cw=wx&&wx.current,wk=pl.wk,co=pl.co,km=me?Math.round(hav(me.lat,me.lon,g.latitude,g.longitude)):null,nq=eq.filter(q=>hav(q.la,q.lo,g.latitude,g.longitude)<800);

  <div class="fns"><div class="fn a" data-n="0"><span class="nt">// LIEU</span><b>${esc(g.name)}</b><div>${esc([g.admin1,g.country].filter(Boolean).join(', '))}</div><div>${g.latitude.toFixed(3)}°, ${g.longitude.toFixed(3)}°</div>${g.elevation!=null?`<div>Altitude ${Math.round(g.elevation)} m</div>`:''}${g.population?`<div>${g.population.toLocaleString('fr-FR')} hab.</div>`:''}</div>

  </div><button class="fx" onclick="D.pl=null;draw()">✕ fermer les notes</button>`}

  <div style="text-align:right"><div class="clock" id="clk">${new Date().toLocaleTimeString('fr-FR')}</div><span class="pill ${on?'ok':'ko'}">${on?'EN LIGNE':'HORS LIGNE'}</span><span class="pill">${D.ping?D.ping+' ms':'… ms'}</span></div></div>
 <div class="stat"><span>RÉSEAU: <b class="${on?'g':'r'}">${on?'EN LIGNE':'HORS LIGNE'}</b></span><span>IA: <b class="${ai?'g':'r'}">${ai?'PRÊTE':'CLÉ MANQUANTE'}</b></span><span>VEILLE: <b class="y">${S.watch.length} SUJET(S)</b></span><span>ALERTES: <b class="${perm==='granted'?'g':'r'}">${perm==='granted'?'ACTIVES':'OFF'}</b></span><span>ISS: <b class="${iss?'g':'y'}">${iss?'SUIVIE':'…'}</b></span></div>
 <div class="grid k4" style="margin-bottom:22px">
  <div class="card"><span class="tag">Projets</span><div class="big" style="margin-top:10px">${S.projects.length}</div><div class="mono" style="margin:6px 0 0">${fin} terminé${fin>1?'s':''}</div></div>
  <div class="card"><span class="tag k">Étapes faites</span><div class="big" style="margin-top:10px">${dn}</div><div class="mono" style="margin:6px 0 0">sur ${tot}</div>${spark(cnt)}</div>
  <div class="card"><span class="tag p">Reste à faire</span><div class="big" style="margin-top:10px">${tot-dn}</div><div class="mono" style="margin:6px 0 0">étapes</div></div>
  <div class="card"><span class="tag w">Veille</span><div class="big" style="margin-top:10px">${S.feed.length}</div><div class="mono" style="margin:6px 0 0">${S.watch.length} suivi${S.watch.length>1?'s':''} · ${S.chats.length} chats</div>${spark(fd)}</div>
 </div>
 <div class="dg first">
  <div class="card"><span class="tag">Assistant</span><h2 style="margin-top:12px">Quoi faire <em>maintenant ?</em></h2>

   <button class="btn" onclick="doAdvice()">${busy==='a'?'Je réfléchis…':'Dis-moi quoi faire'}</button></div>
  <div class="card"><span class="tag p">Projets en cours</span>
   ${S.projects.map(p=>`<div style="margin-top:14px" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="tab='proj';openP='${p.id}';draw()"><div class="row"><b>${esc(p.name)}</b><b class="fit">${pct(p)}%</b></div><div class="bar"><i style="width:${pct(p)}%"></i></div></div>`).join('')||'<div class="mono">Aucun projet. Crée-en un dans Projets.</div>'}</div>
 </div>
 <div class="cc">
 <div class="colL">
  <div class="card"><span class="tag">Météo · ${esc(D.wxName||'…')}</span>${c?`
   <div class="row" style="margin-top:12px"><div class="big">${Math.round(c.temperature_2m)}°C</div><div class="fit" style="font-size:46px">${wi[0]}</div></div>
   <div><b>${wi[1]}</b> · ressenti ${Math.round(c.apparent_temperature)}°</div>
   ${kv('Humidité',c.relative_humidity_2m+' %')}${kv('Vent',Math.round(c.wind_speed_10m)+' km/h')}${kv('Pluie',c.precipitation+' mm')}
   <div class="row" style="margin-top:10px">${w.daily.time.slice(1,4).map((d,i)=>`<div style="text-align:center;font-size:13px"><div>${new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short'})}</div><div style="font-size:24px">${WX(w.daily.weather_code[i+1])[0]}</div><b>${Math.round(w.daily.temperature_2m_max[i+1])}°</b>/${Math.round(w.daily.temperature_2m_min[i+1])}°</div>`).join('')}</div>`:`<div class="mono">${D.wxErr||'Chargement…'}</div>`}
   <button class="btn sm s" style="margin-top:12px" onclick="locate()">📍 Me localiser</button></div>
  <div class="card"><span class="tag k">Système &amp; réseau</span><div style="margin-top:8px">
   ${kv('IP publique',ip.ip||'…')}${kv('Lieu',ip.city?ip.city+', '+ip.country_code:'…')}${kv('Opérateur',(ip.connection&&ip.connection.isp)||'…')}
   ${kv('Réseau',(cn.effectiveType||'?')+' · '+(cn.downlink||'?')+' Mb/s')}${kv('Latence API',D.ping?D.ping+' ms':'…')}
   ${kv('Batterie',bt?Math.round(bt.level*100)+' %'+(bt.charging?' ⚡':''):'n/a')}${kv('CPU / RAM',(navigator.hardwareConcurrency||'?')+' cœurs · '+(navigator.deviceMemory?'≥'+navigator.deviceMemory+' Go':'n/a'))}
   ${kv('Écran',screen.width+'×'+screen.height)}${kv('Fuseau',Intl.DateTimeFormat().resolvedOptions().timeZone)}</div></div>
  <div class="card"><span class="tag p">Top marchés</span><div style="margin-top:6px">
   ${(D.mk||[]).map(c=>{const ch=c.price_change_percentage_24h||0,sp=(c.sparkline_in_7d&&c.sparkline_in_7d.price||[]).filter((_,i)=>i%4===0);return `<div class="mk"><div><b>${esc(c.symbol.toUpperCase())}</b><div class="mono" style="margin:0">$${(c.current_price||0).toLocaleString('en-US')}</div></div><div>${spark(sp,ch>=0?'#35d07f':'#E8470F')}</div><span class="pill ${ch>=0?'ok':'ko'}">${ch>=0?'+':''}${ch.toFixed(1)}%</span></div>`}).join('')||'<div class="mono">Chargement…</div>'}</div></div>
  <div class="card"><span class="tag p">Répartition des étapes</span>
   <div class="row" style="margin-top:14px"><div class="donut fit" style="background:conic-gradient(${stops})"><div>${tot}</div></div>
   <div style="font-size:14px">${S.projects.map((p,i)=>`<div><span style="color:${PC[i%6]}">●</span> ${esc(p.name)} <b>${p.steps.length}</b></div>`).join('')||'<div class="mono">Aucun projet</div>'}</div></div></div>
 </div>
 <div class="colC">
  <div class="card mon"><div class="scbar"><span><i class="live"></i>ARISTEM // MONITEUR MONDIAL</span><span>${me?me.lat.toFixed(2)+'°, '+me.lon.toFixed(2)+'°':'position…'}</span></div>
   <div class="sbar"><input id="gq" value="${esc(D.q||'')}" placeholder="Chercher une ville, un pays, une région…" onkeydown="if(event.key==='Enter')findPlace()"><button class="btn sm fit" onclick="findPlace()">${D.pb?'…':'Chercher'}</button></div>
   ${D.res&&D.res.length>1?`<div>${D.res.map((r,i)=>`<span class="pill" style="cursor:pointer" onclick="pickPlace(${i})">${esc(r.name)}${r.admin1?', '+esc(r.admin1):''} (${esc(r.country_code||'')})</span>`).join('')}</div>`:''}
   ${D.perr?`<div class="mono" style="margin:4px 0">${esc(D.perr)}</div>`:''}
   <div class="hud"><div class="gl" style="position:absolute;inset:0"><svg viewBox="0 0 600 600" aria-hidden="true">
    <g class="rot"><circle cx="300" cy="300" r="292" fill="none" stroke="#FF6A00" stroke-width="2" stroke-dasharray="2 10"/><circle cx="300" cy="300" r="278" fill="none" stroke="#FFB627" stroke-width="10" stroke-dasharray="3 17" opacity=".55"/></g>
    <g class="rot rot2"><circle cx="300" cy="300" r="262" fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="60 12 8 12"/></g>
    ${[[246,hv[0],'#FF6A00']].map(([r,v,k])=>`<circle cx="300" cy="300" r="${r}" fill="none" stroke="#3a1c0a" stroke-width="9"/><circle cx="300" cy="300" r="${r}" fill="none" stroke="${k}" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.max(.01,v)} 100" transform="rotate(-90 300 300)"/>`).join('')}
    </svg><canvas id="globe"></canvas>

   <div class="mono" style="margin:6px 0 0;text-align:center">// molette, pincement ou boutons pour zoomer · glisse pour tourner</div>

   <div class="mono" style="margin:10px 0 0">${S.watch.length?'Vérifié toutes les 5 min · dernière : '+(D.lastWatch?hm(D.lastWatch):'…'):'Ajoute un sujet : seules les infos nouvelles et pertinentes arriveront ici.'}</div>

 ${S.projects.map(p=>`<div class="card" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="openP='${p.id}';draw()"><h2>${esc(p.name)}</h2><div class="bar"><i style="width:${pct(p)}%"></i></div></div>`).join('')}`;
}
function addProj(){const n=$('#pn').value.trim();if(!n)return;const t=$('#pt').value;S.projects.push({id:uid(),name:n,steps:(TPL[t]||[]).map(x=>({t:x,done:false}))});save();draw()}
function tog(id,i){const p=S.projects.find(x=>x.id===id);const st=p.steps[i];st.done=!st.done;st.at=st.done?Date.now():null;save();if(st.done&&pct(p)===100)note('Projet terminé : '+p.name,true);draw()}
function delStep(id,i){S.projects.find(x=>x.id===id).steps.splice(i,1);save();draw()}
function addStep(id){const v=$('#ns').value.trim();if(!v)return;S.projects.find(x=>x.id===id).steps.push({t:v,done:false});save();draw()}
async function aiSteps(id){
 if(busy)return;busy=true;draw();const p=S.projects.find(x=>x.id===id);
 try{const t=await ask(S.main,[{role:'user',text:`Projet : "${p.name}". Donne 6 à 9 étapes concrètes dans l'ordre. Réponds UNIQUEMENT avec un tableau JSON de chaînes.`}],{system:'Tu réponds uniquement en JSON valide.'});
 const a=JSON.parse(t.match(/\[[\s\S]*\]/)[0]);a.forEach(x=>p.steps.push({t:String(x),done:false}));save()}catch(e){err(e)}
 busy=false;draw();
}
function chat(){
 const c=S.chats.find(x=>x.id===openC);
 if(c)return `<div class="mono">// ${esc(prov(c.pid).name).toUpperCase()}</div><button class="btn sm s" onclick="openC=null;draw()">← Discussions</button><button class="btn sm s" onclick="if(confirm('Supprimer cette discussion ?')){S.chats=S.chats.filter(x=>x.id!==openC);openC=null;save();draw()}">🗑 Supprimer</button>
 <div>${c.msgs.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.text):md(m.text)}</div>`).join('')}${busy?'<div class="msg a pulse">…</div>':''}</div>
 <div class="row" style="margin-top:12px"><input id="ci" placeholder="Écris ou dicte…" onkeydown="if(event.key==='Enter')send()"><button class="btn sm fit s" onclick="listen(t=>{$('#ci').value=t;send()})">🎤</button><button class="btn sm fit" onclick="send()">OK</button></div>`;
 return `<div class="mono">// NOUVELLE DISCUSSION</div><div class="card"><h2>Avec quelle <em>IA ?</em></h2>
 <select id="cp">${S.providers.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.model)}</option>`).join('')}</select>
 <button class="btn" onclick="newChat()">Démarrer</button></div>
 <div class="mono">// TOUTES MES DISCUSSIONS</div>
 ${S.chats.slice().reverse().map(c=>`<div class="card" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="openC='${c.id}';draw()"><span class="tag p">${esc(prov(c.pid).name)}</span><h2>${esc(c.title)}</h2><div class="mono" style="margin:0">${c.msgs.length} messages</div></div>`).join('')||'<div class="card">Aucune discussion pour le moment.</div>'}`;
}
function renP(id){const p=S.projects.find(x=>x.id===id),n=prompt('Nouveau nom du projet',p.name);if(n&&n.trim()){p.name=n.trim();save();draw()}}
function exportData(){const d=JSON.parse(JSON.stringify(S));d.providers.forEach(p=>p.key='');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));a.download='aristem-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function importData(f){if(!f)return;f.text().then(x=>{const d=JSON.parse(x);if(!Array.isArray(d.projects))throw new Error('fichier invalide');const k=Object.fromEntries(S.providers.map(p=>[p.id,p.key]));Object.assign(S,d);S.providers.forEach(p=>{if(k[p.id])p.key=k[p.id]});save();draw()}).catch(err)}
function newChat(){const c={id:uid(),pid:$('#cp').value,title:'Nouvelle discussion',msgs:[]};S.chats.push(c);openC=c.id;save();draw()}
async function send(){
 const i=$('#ci'),t=i.value.trim();if(!t||busy)return;const c=S.chats.find(x=>x.id===openC);
 c.msgs.push({role:'user',text:t});if(c.msgs.length===1)c.title=t.slice(0,40);busy=true;save();draw();
 try{const h=c.msgs.slice(-20),a=await ask(c.pid,h[0].role==='user'?h:h.slice(1));c.msgs.push({role:'assistant',text:a});speak(a)}catch(e){err(e)}
 busy=false;save();draw();window.scrollTo(0,document.body.scrollHeight);
}
function cam(){
 return `<div class="mono">// SATORU</div><div class="card"><h2>Montre-moi <em>un objet</em></h2>
 ${shot?`<img class="shot" src="${shot}">`:camOn?`<video id="v" autoplay playsinline muted></video>`:`<div class="cam0">// caméra éteinte</div>`}
 ${shot?`<button class="btn s" onclick="shot=null;camOut='';startCam()">Refaire la photo</button>`:camOn?`<button class="btn" onclick="snap()">Analyser l'objet</button><button class="btn s" onclick="stopCam();draw()">Éteindre la caméra</button>`:`<button class="btn" onclick="startCam()">📷 Activer la caméra</button>`}
 ${busy?'<div class="pulse">Satoru analyse…</div>':''}
 ${camOut?`<div style="white-space:pre-wrap;margin-top:12px">${esc(camOut)}</div>`:''}</div>`;
}
async function startCam(){try{stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});camOn=true;draw()}catch(e){alert('Caméra refusée ou indisponible')}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}camOn=false}
async function snap(){
 const v=$('#v');if(!v||!v.videoWidth)return;const c=document.createElement('canvas'),k=Math.min(1,900/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);
 shot=c.toDataURL('image/jpeg',.8);stopCam();busy=true;camOut='';draw();
 try{camOut=await ask(S.main,[{role:'user',text:'Identifie cet objet et donne ses caractéristiques principales (nom, matière, usage, dimensions approximatives, état, valeur estimée si pertinent).'}],{img:shot,system:'Tu es Satoru. Réponds en français, court et précis, sans markdown.'});speak(camOut)}catch(e){err(e)}
 busy=false;draw();
}
function sett(){
 return `<div class="mono">// RÉGLAGES</div><div class="card"><h2>Mes <em>IA</em></h2>
 <input id="nm" value="${esc(S.name)}" placeholder="Ton prénom (facultatif)" onchange="S.name=this.value;save()">
 <label class="row"><input type="checkbox" style="flex:none;width:24px" ${S.voice?'checked':''} onchange="S.voice=this.checked;save()"><span>Réponses à voix haute</span></label></div>
 ${S.providers.map((p,i)=>`<div class="card"><span class="tag ${p.id===S.main?'':'w'}">${p.id===S.main?'IA principale':p.type}</span>
 <input value="${esc(p.name)}" placeholder="Nom" onchange="S.providers[${i}].name=this.value;save()">
 <input value="${esc(p.url)}" placeholder="URL de l'API" onchange="S.providers[${i}].url=this.value;save()">
 <input value="${esc(p.model)}" placeholder="Modèle" onchange="S.providers[${i}].model=this.value;save()">
 <input type="password" value="${esc(p.key)}" placeholder="Clé API" onchange="S.providers[${i}].key=this.value;save()">
 <button class="btn sm y" onclick="S.main='${p.id}';save();draw()">Principale</button>
 ${i>1?`<button class="btn sm s" onclick="S.providers.splice(${i},1);save();draw()">Supprimer</button>`:''}</div>`).join('')}
 <button class="btn s" onclick="S.providers.push({id:uid(),name:'Autre IA',type:'openai',url:'https://api.groq.com/openai/v1/chat/completions',model:'',key:''});save();draw()">+ Ajouter une IA (compatible OpenAI)</button>
 <div class="card"><span class="tag k">Sauvegarde</span><button class="btn" onclick="exportData()">Exporter mes données (sans les clés)</button><input type="file" accept="application/json" onchange="importData(this.files[0])"></div>
 <div class="mono">Clés gratuites : <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Gemini</a> · <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq</a> · <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a></div>
 <div class="mono">Les clés restent sur ton téléphone (stockage local, non chiffré).</div>`;
}
const IC={dash:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>`,proj:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>`,chat:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,cam:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,set:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>`};
const TABS=[['dash',IC.dash,'Tableau',dash],['proj',IC.proj,'Projets',projects],['chat',IC.chat,'Chat',chat],['cam',IC.cam,'Satoru',cam],['set',IC.set,'Réglages',sett]];
function draw(){
 const t=TABS.find(x=>x[0]===tab);
 $('#app').className='app'+(tab==='dash'?'':' narrow');$('#app').innerHTML=t[3]();
 $('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');
 const v=$('#v');if(v&&stream)v.srcObject=stream;
 if(tab==='dash')foldInit();
}
function foldInit(){document.querySelectorAll('#app .card').forEach(c=>{const g=c.querySelector(':scope>.tag');if(!g||c.classList.contains('mon')||c.closest('.grid,.first'))return;const k=g.textContent.trim().split(' · ')[0];g.dataset.k=k;g.tabIndex=0;g.setAttribute('role','button');c.classList.add('fold');const f=(S.fold||{})[k];if(f===undefined?(innerWidth<760&&!/^(Météo|Veille)/.test(k)):f)c.classList.add('shut')})}
document.addEventListener('click',e=>{const g=e.target.closest('.card.fold>.tag');if(!g)return;const c=g.parentElement;c.classList.toggle('shut');(S.fold=S.fold||{})[g.dataset.k]=c.classList.contains('shut');save()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('.card.fold>.tag'))e.target.click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')G.tz=1});
async function tapGlobe(e){const r=$('#globe').getBoundingClientRect(),ll=G.pr&&G.pr.invert([e.clientX-r.left,e.clientY-r.top]);if(!ll||isNaN(ll[0])||isNaN(ll[1]))return;const[lo,la]=ll;
 let g={name:la.toFixed(2)+'°, '+lo.toFixed(2)+'°',latitude:la,longitude:lo};
 try{const d=await J(`https://nominatim.openstreetmap.org/reverse?lat=${la}&lon=${lo}&format=jsonv2&zoom=10&accept-language=fr`),a=d.address;if(a)g={name:a.city||a.town||a.village||a.municipality||a.county||a.state||d.name||g.name,admin1:a.state||a.region,country:a.country,country_code:(a.country_code||'').toUpperCase(),latitude:la,longitude:lo}}catch(x){}
 D.res=[];D.perr='';selectPlace(g)}
let TAP=null;
document.addEventListener('pointerdown',e=>{TAP=(e.target.id==='globe'&&P.size===0)?{x:e.clientX,y:e.clientY,t:Date.now()}:null},true);
document.addEventListener('pointerup',e=>{if(TAP&&G.full&&e.target.id==='globe'&&Math.hypot(e.clientX-TAP.x,e.clientY-TAP.y)<8&&Date.now()-TAP.t<600)tapGlobe(e);TAP=null});

addEventListener('online',gate);addEventListener('offline',gate);gate();draw();
setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('fr-FR');[undefined,'UTC','Europe/Paris','America/New_York','Asia/Tokyo'].forEach((z,i)=>setT('wc'+i,wct(z)));if(D.pl&&D.pl.g&&D.pl.g.timezone)setT('plt',wct(D.pl.g.timezone))},1000);
requestAnimationFrame(drawGlobe);addEventListener('load',initGlobe);
